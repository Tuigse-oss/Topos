ShortDescription: Free, open-source disk-space treemap visualizer for Windows 10 and 11.
Description: |-
  Topos shows a drive or folder as a treemap: every folder and file is a tile sized by how much space it takes,
  nested inside its folder. Zoom in and out, open a file or show it in Explorer, or delete it to the Recycle Bin
  straight from the map. Each drive's last scan is kept, so the next start shows the map in under a second while
  a fresh scan runs.
