name: release

# A version tag builds both architectures in parallel (zip, installer, and
# MSIX package each, every one tested), then one final job bundles the
# MSIX packages for the Microsoft Store, writes a single SHA256SUMS.txt over
# every release file, attests them, and creates one draft release.
on:
  push:
    tags: ["v*"]
  # A manual run builds the same files as a workflow artifact to try out,
  # without creating a release.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: rustsec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 install cargo-audit --version 0.22.2 --locked
      - run: cargo +1.99.1 audit --deny warnings

  build:
    name: build and package (${{ matrix.arch }})
    needs: audit
    runs-on: windows-latest
    # A stuck Setup or Add-AppxPackage must fail the leg, not burn the 6 h
    # quota.
    timeout-minutes: 60
    strategy:
      # Both architectures ship together, so a failure in one stops both.
      fail-fast: true
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            suffix: x86_64
          - arch: x86
            target: i686-pc-windows-msvc
            suffix: x86
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version and check the tag matches Cargo.toml
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        # The installers' file version and the MSIX version are numeric,
        # so a release version is plain X.Y.Z. A release also ships the
        # Store package, which must carry the identity Partner Center
        # assigned; only test builds may fall back to the test-only one.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml version $version is not plain X.Y.Z"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && { [ -z "$MSIX_IDENTITY_NAME" ] || [ -z "$MSIX_PUBLISHER" ]; }; then
            echo "::error::Set the repository variables MSIX_IDENTITY_NAME and MSIX_PUBLISHER from Partner Center before tagging a release (packaging/README.md, Microsoft Store)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy --target ${{ matrix.target }}
      - run: cargo +1.99.1 clippy --locked --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      # Plain `cargo test` leaves out the Gungraun bench target, which needs
      # gungraun-runner and Valgrind; clippy above still compiles it. The
      # x86 tests run natively on the x64 runner.
      - run: cargo +1.99.1 test --locked --target ${{ matrix.target }}
      - run: cargo +1.99.1 install cargo-auditable --version 0.7.7 --locked
      # Embeds the dependency list in the exe, so the shipped binary itself
      # can be checked against RustSec later with `cargo audit bin`.
      - run: cargo +1.99.1 auditable build --locked --release --target ${{ matrix.target }}
      - name: Verify the program reports the release version
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/$env:TARGET/release/Topos.exe").ProviderPath
          $probe = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru `
            -RedirectStandardOutput version.txt -RedirectStandardError version-stderr.txt
          $actual = "$(Get-Content version.txt -Raw)".Trim()
          $expected = "topos $env:VERSION"
          if ($probe.ExitCode -ne 0 -or $actual -ne $expected) {
            Get-Content version-stderr.txt
            throw "Program version '$actual' does not match '$expected' (exit $($probe.ExitCode))"
          }
          Write-Host "ok: packaged program reports $actual"
          Get-FileHash -LiteralPath $exe -Algorithm SHA256
      - name: Generate the installer and Store art
        # Setup's icon and wizard images, and the MSIX logos, into
        # installer-art\ (where installer\topos.iss looks by default).
        run: cargo +1.99.1 run --locked --release --example art -- installer-art
      - name: Package
        shell: bash
        # The program ships with its licenses and the third-party notices the
        # linked crates' licenses require, never as a bare exe.
        run: |
          mkdir -p "package-$ARCH" dist
          cp "target/$TARGET/release/Topos.exe" "package-$ARCH/"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt README.md "package-$ARCH/"
          (cd "package-$ARCH" && 7z a -tzip "../dist/Topos-$TAG-$SUFFIX-windows.zip" ./*)
      - name: Build the installer
        # Installs from package-<arch>\ with art from installer-art\ into
        # dist\, the script's default paths.
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DTargetArch=$env:ARCH" installer\topos.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test install, upgrade from the last release, and uninstall
        # Upgrades from the latest published release's installer for this
        # architecture, the way winget and Chocolatey will; before the first
        # release, reinstalls this one over itself.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $new = "dist\Topos-$env:TAG-$env:SUFFIX-setup.exe"
          $old = $new
          $oldVersion = $env:VERSION
          $last = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""'
          if ($LASTEXITCODE -ne 0) { throw "gh release list exited with $LASTEXITCODE" }
          if ($last) {
            $name = "Topos-$last-$env:SUFFIX-setup.exe"
            gh release download $last --repo $env:GITHUB_REPOSITORY --pattern $name --dir previous
            if ($LASTEXITCODE -eq 0 -and (Test-Path "previous\$name")) {
              $old = (Resolve-Path -LiteralPath "previous\$name").ProviderPath
              $oldVersion = $last.TrimStart('v')
            } else {
              Write-Host "::warning::$last has no $name; reinstalling this build over itself instead"
              # The runner's wrapper exits with the last native exit code.
              $global:LASTEXITCODE = 0
            }
          }
          installer\test-installer.ps1 -Arch $env:ARCH -Old $old -OldVersion $oldVersion -New $new -NewVersion $env:VERSION -ProgramVersion $env:VERSION
      - name: Build the MSIX package
        # Unsigned: the Store signs what it distributes. The identity comes
        # from Partner Center through repository variables; without them the
        # script uses test-only values and warns.
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: >
          packaging\msix\build-msix.ps1 -Version $env:VERSION -Arch $env:ARCH
          -SourceDir "package-$env:ARCH" -ArtDir installer-art -OutDir msix
          -IdentityName "$env:MSIX_IDENTITY_NAME" -Publisher "$env:MSIX_PUBLISHER"
          -PublisherDisplayName "$env:MSIX_PUBLISHER_DISPLAY_NAME"
      - name: Test the MSIX package (signed copy, install, alias, remove)
        shell: powershell
        run: installer\test-msix.ps1 -Package "msix\Topos-$env:TAG-$env:ARCH.msix" -Version $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-${{ matrix.arch }}
          path: msix/*.msix
          if-no-files-found: error
          retention-days: 7

  publish:
    name: bundle, checksums, and draft release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msix-*
          merge-multiple: true
          path: msix
      - name: Bundle the MSIX packages
        # One .msixbundle holds both architectures; Windows installs the one
        # that fits.
        shell: pwsh
        run: |
          $bin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $sdk = Get-ChildItem -LiteralPath $bin -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){3}$' -and (Test-Path (Join-Path $_.FullName 'x64\makeappx.exe')) } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdk) { throw "makeappx.exe not found under $bin" }
          $makeappx = Join-Path $sdk.FullName 'x64\makeappx.exe'
          $packages = @(Get-ChildItem msix -Filter '*.msix' | ForEach-Object Name | Sort-Object)
          $expected = @("Topos-$env:TAG-x64.msix", "Topos-$env:TAG-x86.msix")
          if (Compare-Object $packages $expected) { throw "expected $($expected -join ', '), found $($packages -join ', ')" }
          New-Item -ItemType Directory -Force bundle | Out-Null
          & $makeappx bundle /d msix /p "bundle\Topos-$env:TAG.msixbundle" /bv "$env:VERSION.0" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle exited with $LASTEXITCODE" }
      - name: Test the bundle (signed copy, install, alias, remove)
        shell: powershell
        run: installer\test-msix.ps1 -Package "bundle\Topos-$env:TAG.msixbundle" -Version $env:VERSION
      - name: Wrap the bundle for the Store
        # An .msixupload is a zip holding the bundle; it is what Partner
        # Center and the msstore CLI take. It is not installable, which is
        # intended: people install from the Store, the installer, or the zip.
        # The bundle is extracted again and compared, so what ships is
        # exactly what was tested.
        shell: bash
        run: |
          upload="dist/Topos-$TAG-store.msixupload"
          (cd bundle && 7z a -tzip "../$upload" "Topos-$TAG.msixbundle")
          mkdir -p check && 7z x -ocheck "$upload"
          tested=$(sha256sum "bundle/Topos-$TAG.msixbundle" | cut -d' ' -f1)
          shipped=$(sha256sum "check/Topos-$TAG.msixbundle" | cut -d' ' -f1)
          entries=(check/*)
          if [ "$tested" != "$shipped" ] || [ "${#entries[@]}" != 1 ]; then
            echo "::error::$upload does not hold exactly the tested bundle"
            exit 1
          fi
      - name: Checksums
        # One SHA256SUMS.txt over every release file, and nothing else in
        # dist/ that would slip into the release unchecksummed.
        shell: bash
        run: |
          cd dist
          expected="Topos-$TAG-store.msixupload
          Topos-$TAG-x86-setup.exe
          Topos-$TAG-x86-windows.zip
          Topos-$TAG-x86_64-setup.exe
          Topos-$TAG-x86_64-windows.zip"
          actual=$(printf '%s\n' * | LC_ALL=C sort)
          if [ "$actual" != "$(echo "$expected" | sed 's/^ *//' | LC_ALL=C sort)" ]; then
            echo "::error::unexpected release files:"
            echo "$actual"
            exit 1
          fi
          sha256sum Topos-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        # Artifact attestations are free for public repositories.
        if: github.ref_type == 'tag' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Topos-*
      - name: Upload the test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Topos-${{ env.TAG }}-test-build
          path: dist/*
          if-no-files-found: error
      - name: Create a draft release
        # A draft stays unpublished until it is reviewed and released by hand.
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Topos $TAG" --generate-notes
